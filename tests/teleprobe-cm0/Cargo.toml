[package]
name = "teleprobe-cm0-test"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
mcu-crypto-asm = { path = "../.." }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "c0fdd08", features = ["defmt", "time-driver-any", "stm32c031c6", "memory-x"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "c0fdd08", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "c0fdd08", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
defmt = "1"
defmt-rtt = "1"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-probe = { version = "1", features = ["print-defmt"] }

[[bin]]
name = "p256_cm0_test"
path = "src/main.rs"

[profile.release]
debug = 2
opt-level = "s"
lto = true
