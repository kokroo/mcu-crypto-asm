[package]
name = "mcu-crypto-asm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Hand-written assembly cryptography for 32-bit microcontrollers: constant-time, no_std, Cortex-M and Xtensa. Currently P-256 and P-384."
repository = "https://github.com/kokroo/mcu-crypto-asm"
categories = ["cryptography", "no-std", "embedded"]
keywords = ["crypto", "embedded", "no-std", "cortex-m", "assembly"]

[dependencies]
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "69208416f8", optional = true }

[dev-dependencies]
embassy-crypto-test = { git = "https://github.com/embassy-rs/embassy", rev = "69208416f8" }

# Host-only dev-dependencies. These transitively require std (getrandom via
# proptest's rand, std itself in libtest-mimic, hex's default "std" feature)
# and must not be compiled for the bare-metal `cargo qtest` targets.
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
num-bigint = "0.4"
num-traits = "0.2"
hex = "0.4"
proptest = "1"
# Host side of the dual-mode `embassy_suites` test target (harness = false).
libtest-mimic = "0.8"

# Bare-metal side, only compiled for `cargo qtest` cross targets
# (embedded-test 0.7.x protocol, supported by cargo-qemu-test).
[target.'cfg(target_os = "none")'.dev-dependencies]
embedded-test = "0.7"
defmt = "1.1.1"
defmt-semihosting = "0.3.0"
cortex-m-rt = "0.7"
# Pulls cortex-m-rt into the final link (fixes `symbol not found: DefaultHandler_`)
# and provides the critical-section implementation embedded-test relies on.
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }

# Dual-mode (host libtest-mimic / embedded-test under QEMU); driven by
# `cargo qtest --target thumbv7em-none-eabihf --features embassy-driver`.
[[test]]
name = "embassy_suites"
harness = false

[features]
default = []
# Force the portable backend even on an arch that has assembly. Used by the
# differential tests: they need BOTH backends live in one binary to compare.
force-portable = []
# Implement embassy-crypto-driver's P256Ops for this crate.
embassy-driver = ["dep:embassy-crypto"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = true
