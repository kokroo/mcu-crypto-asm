[package]
name = "teleprobe-hil-test"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "all_crypto_test"

[dependencies]
mcu-crypto-asm = { path = "../.." }
defmt = "1"
defmt-rtt = "1"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-probe = { version = "1", features = ["print-defmt"] }

[[bin]]
name = "all_crypto_test"
path = "src/main.rs"

[profile.release]
debug = 2
opt-level = "s"
lto = true
codegen-units = 1
