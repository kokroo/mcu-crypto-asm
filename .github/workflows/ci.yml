name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy -- -D warnings
  host:
    name: host tests (oracles + constant-time audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cache rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bin-host
      - run: cargo test --verbose
      - run: cargo test --features force-portable --verbose
      - run: cargo test --features embassy-all --test embassy_suites
  cross:
    name: cross-compile (assembly backends must build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv7em-none-eabihf # Cortex-M4 / M7
          - thumbv7em-none-eabi
          - thumbv8m.main-none-eabihf # Cortex-M33
          - thumbv7m-none-eabi # Cortex-M3: must fall back to portable
          - thumbv6m-none-eabi # Cortex-M0+: portable
          - riscv32imc-unknown-none-elf
          - riscv32imac-unknown-none-elf
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

  emulated:
    name: on-target tests under QEMU (M4 + M7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm gcc-arm-none-eabi
      - run: rustup target add thumbv7em-none-eabihf
      - name: correctness + constant time + benchmark
        working-directory: harness
        run: |
          cargo build --release
          for m in "mps2-an386 cortex-m4" "mps2-an500 cortex-m7"; do
            set -- $m
            echo "=== $1 ($2) ==="
            qemu-system-arm -machine $1 -cpu $2 -nographic \
              -semihosting-config enable=on,target=native \
              -kernel target/thumbv7em-none-eabihf/release/nistp-harness
          done
      - name: constant-time (deterministic instruction counting)
        working-directory: harness
        run: |
          qemu-system-arm -machine mps2-an386 -cpu cortex-m4 -icount shift=0 \
            -nographic -semihosting-config enable=on,target=native \
            -kernel target/thumbv7em-none-eabihf/release/ct
  embassy-suites:
    name: embassy suites on QEMU (cargo-qtest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv7em-none-eabihf # Cortex-M4 / M7
          # - thumbv7em-none-eabi
          - thumbv8m.main-none-eabihf # Cortex-M33
          - thumbv7m-none-eabi # Cortex-M3: must fall back to portable
          # - thumbv6m-none-eabi # Cortex-M0+: portable
          - riscv32imc-unknown-none-elf
          - riscv32imac-unknown-none-elf
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-system-riscv32
      - run: rustup target add ${{ matrix.target }}
      - name: cache rust
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bin
      - name: install cargo-qtest
        run: cargo install --git https://github.com/xoviat/cargo-qemu-test --force
      - name: run suites under QEMU (one fresh boot per test)
        run: cargo qtest --target ${{ matrix.target }} --release --features embassy-all --test embassy_suites --verbose

  xtensa-qemu:
    name: xtensa suites on QEMU (ESP32 / ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32,esp32s3
          ldproxy: false
      - name: Install QEMU runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgcrypt20 libglib2.0-0 libpixman-1-0 libslirp0
      - name: Cache QEMU Xtensa binary
        id: cache-qemu
        uses: actions/cache@v4
        with:
          path: /opt/qemu-xtensa
          key: qemu-system-xtensa-v0.1.0-noble
      - name: Download prebuilt QEMU Xtensa
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/qemu-xtensa
          curl -sL https://github.com/kokroo/qemu/releases/download/v0.1.0-semihosting/qemu-system-xtensa-esp32.tar.gz | sudo tar -xz -C /opt/qemu-xtensa
          sudo chmod +x /opt/qemu-xtensa/qemu-system-xtensa
      - name: Add QEMU to PATH
        run: echo "/opt/qemu-xtensa" >> "$GITHUB_PATH"
      - name: Install cargo-qtest
        run: cargo install --git https://github.com/xoviat/cargo-qemu-test --force
      - name: Cross-compile check for ESP32 (LX6)
        env:
          CARGO_UNSTABLE_BUILD_STD: core
          CARGO_UNSTABLE_BUILD_STD_FEATURES: compiler-builtins-mem
        run: cargo build --release --target xtensa-esp32-none-elf
      - name: Run embassy suites under QEMU on ESP32-S3 (LX7)
        env:
          CARGO_UNSTABLE_BUILD_STD: core
          CARGO_UNSTABLE_BUILD_STD_FEATURES: compiler-builtins-mem
        run: cargo qtest --target xtensa-esp32s3-none-elf --release --features embassy-all --test embassy_suites --verbose

