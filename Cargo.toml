[package]
name = "mcu-crypto-asm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Hand-written assembly cryptography for 32-bit microcontrollers: constant-time, no_std, Cortex-M and Xtensa. Currently P-256 and P-384."
repository = "https://github.com/kokroo/mcu-crypto-asm"
categories = ["cryptography", "no-std", "embedded"]
keywords = ["crypto", "embedded", "no-std", "cortex-m", "assembly"]

[dependencies]
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "69208416f8", optional = true }

[dev-dependencies]
embassy-crypto-test = { git = "https://github.com/embassy-rs/embassy", rev = "69208416f8" }
qemu-test = "0.1.0"

# Host-only dev-dependencies. These transitively require std (getrandom via
# proptest's rand, std itself in libtest-mimic, hex's default "std" feature)
# and must not be compiled for the bare-metal `cargo qtest` targets.
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
num-bigint = "0.4"
num-traits = "0.2"
hex = "0.4"
proptest = "1"

# Bare-metal side, compiled for `cargo qtest` cross targets
[target.'cfg(target_os = "none")'.dev-dependencies]
semihosting = { version = "0.1.25", features = ["stdio"] }

# Bare-metal arm side, compiled for `cargo qtest` cross targets
[target.'cfg(all(target_os = "none",target_arch = "arm"))'.dev-dependencies]
cortex-m-rt = "0.7"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }

# Dual-mode (host libtest-mimic / embedded-test under QEMU); driven by
# `cargo qtest --target thumbv7em-none-eabihf --features embassy-all`.
[[test]]
name = "embassy_suites"
harness = false

[features]
default = []
# Force the portable backend even on an arch that has assembly. Used by the
# differential tests: they need BOTH backends live in one binary to compare.
force-portable = []

## Register every embassy driver this crate can provide.
embassy-all = [
    "embassy-crypto-md5", "embassy-crypto-sha1", "embassy-crypto-sha224", "embassy-crypto-sha256",
    "embassy-crypto-sha384", "embassy-crypto-sha512", "embassy-crypto-sha512-224", "embassy-crypto-sha512-256",
    "embassy-crypto-hmac-sha1", "embassy-crypto-hmac-sha224", "embassy-crypto-hmac-sha256", "embassy-crypto-hmac-sha384",
    "embassy-crypto-hmac-sha512", "embassy-crypto-hmac-sha512-224", "embassy-crypto-hmac-sha512-256",
    "embassy-crypto-aes128-ecb", "embassy-crypto-aes128-cbc", "embassy-crypto-aes128-ctr",
    "embassy-crypto-aes128-gcm", "embassy-crypto-aes128-ccm", "embassy-crypto-aes128-cmac",
    "embassy-crypto-aes256-ecb", "embassy-crypto-aes256-cbc", "embassy-crypto-aes256-ctr",
    "embassy-crypto-aes256-gcm", "embassy-crypto-aes256-ccm", "embassy-crypto-aes256-cmac",
    "embassy-crypto-p256-arith", "embassy-crypto-p256-ecdh", "embassy-crypto-p256-ecdsa",
    "embassy-crypto-p384-arith", "embassy-crypto-p384-ecdh", "embassy-crypto-p384-ecdsa",
    "embassy-crypto-chacha8", "embassy-crypto-chacha12", "embassy-crypto-chacha20",
    "embassy-crypto-chacha8-poly1305", "embassy-crypto-chacha12-poly1305", "embassy-crypto-chacha20-poly1305",
    "embassy-crypto-x25519", "embassy-crypto-ed25519",
]

## One feature per `embassy-crypto` driver. Enabling it registers this crate's
## implementation as the global driver for that operation.
embassy-crypto-md5 = ["dep:embassy-crypto"]
embassy-crypto-sha1 = ["dep:embassy-crypto"]
embassy-crypto-sha224 = ["dep:embassy-crypto"]
embassy-crypto-sha256 = ["dep:embassy-crypto"]
embassy-crypto-sha384 = ["dep:embassy-crypto"]
embassy-crypto-sha512 = ["dep:embassy-crypto"]
embassy-crypto-sha512-224 = ["dep:embassy-crypto"]
embassy-crypto-sha512-256 = ["dep:embassy-crypto"]
embassy-crypto-hmac-sha1 = ["dep:embassy-crypto"]
embassy-crypto-hmac-sha224 = ["dep:embassy-crypto"]
embassy-crypto-hmac-sha256 = ["dep:embassy-crypto"]
embassy-crypto-hmac-sha384 = ["dep:embassy-crypto"]
embassy-crypto-hmac-sha512 = ["dep:embassy-crypto"]
embassy-crypto-hmac-sha512-224 = ["dep:embassy-crypto"]
embassy-crypto-hmac-sha512-256 = ["dep:embassy-crypto"]
embassy-crypto-aes128-ecb = ["dep:embassy-crypto"]
embassy-crypto-aes128-cbc = ["dep:embassy-crypto"]
embassy-crypto-aes128-ctr = ["dep:embassy-crypto"]
embassy-crypto-aes128-gcm = ["dep:embassy-crypto"]
embassy-crypto-aes128-ccm = ["dep:embassy-crypto"]
embassy-crypto-aes128-cmac = ["dep:embassy-crypto"]
embassy-crypto-aes256-ecb = ["dep:embassy-crypto"]
embassy-crypto-aes256-cbc = ["dep:embassy-crypto"]
embassy-crypto-aes256-ctr = ["dep:embassy-crypto"]
embassy-crypto-aes256-gcm = ["dep:embassy-crypto"]
embassy-crypto-aes256-ccm = ["dep:embassy-crypto"]
embassy-crypto-aes256-cmac = ["dep:embassy-crypto"]
embassy-crypto-chacha8 = ["dep:embassy-crypto"]
embassy-crypto-chacha12 = ["dep:embassy-crypto"]
embassy-crypto-chacha20 = ["dep:embassy-crypto"]
embassy-crypto-chacha8-poly1305 = ["dep:embassy-crypto"]
embassy-crypto-chacha12-poly1305 = ["dep:embassy-crypto"]
embassy-crypto-chacha20-poly1305 = ["dep:embassy-crypto"]
embassy-crypto-p256-arith = ["dep:embassy-crypto"]
embassy-crypto-p256-ecdh = ["dep:embassy-crypto"]
embassy-crypto-p256-ecdsa = ["dep:embassy-crypto"]
embassy-crypto-p384-arith = ["dep:embassy-crypto"]
embassy-crypto-p384-ecdh = ["dep:embassy-crypto"]
embassy-crypto-p384-ecdsa = ["dep:embassy-crypto"]
embassy-crypto-x25519 = ["dep:embassy-crypto"]
embassy-crypto-ed25519 = ["dep:embassy-crypto"]


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = true
