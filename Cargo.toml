[package]
name = "nistp-mcu"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fast constant-time P-256 / P-384 field arithmetic for 32-bit MCUs (Cortex-M4 UMAAL, Xtensa LX7)"
repository = "https://github.com/Emill/nistp-mcu"
categories = ["cryptography", "no-std", "embedded"]
keywords = ["p256", "p384", "ecc", "cortex-m", "xtensa"]

[dependencies]

[dev-dependencies]
num-bigint = "0.4"
num-traits = "0.2"
hex = "0.4"
proptest = "1"

[features]
default = []
# Force the portable backend even on an arch that has assembly. Used by the
# differential tests: they need BOTH backends live in one binary to compare.
force-portable = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = true
